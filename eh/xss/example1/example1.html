
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script>
      //opening a javscript code and writing a code in it will execute upon loading the page.
      alert('alert from header');

      function showMessage(){
        alert("from a function");
      }
    </script>

</head>
  <body onload="alert('alert2')">

    <div class="container">
        <div class='row'>
            <div class="col-4 offset-md-4" style='margin-top:100px'>

              <!-- scripts can also loaded from the body using script tag. It will run also on load-->
              <script> alert('alert from body'); </script>
              <!-- Events can also be attached to `a` tag. `onmouseover` mean just place the cursor (mouse) over the link -->
              <a onclick="showMessage()" >Click here</a>
              <a onmouseover="alert('mouse over')" >mouse over here</a>
            </div>
        </div>
     </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
